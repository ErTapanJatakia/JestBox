name: Syft software bill of materials

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: Generate CycloneDX and SPDX inventories
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Generate source-tree SBOMs with Syft
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -v "$GITHUB_WORKSPACE:/src" \
            anchore/syft:v1.54.0 scan dir:/src \
            -o cyclonedx-json=/src/jestbox-sbom.cdx.json \
            -o spdx-json=/src/jestbox-sbom.spdx.json
          test -s jestbox-sbom.cdx.json
          test -s jestbox-sbom.spdx.json
      - name: Generate SBOM inventory summary
        shell: bash
        run: |
          set -euo pipefail
          COUNT="$(jq '[.components[]?] | length' jestbox-sbom.cdx.json)"
          {
            printf "# JestBox source SBOM\n\n"
            printf -- "- Commit: %s\n" "$GITHUB_SHA"
            printf -- "- Workflow run: %s\n" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf -- "- CycloneDX components: %s\n" "$COUNT"
            printf "%s\n" "- Formats: CycloneDX JSON and SPDX JSON"
            printf "\n%s\n" "This inventory describes components discoverable in the checked-out source tree. It is not an inventory of a signed production APK."
          } > jestbox-sbom-summary.md
          cat jestbox-sbom-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Archive CycloneDX, SPDX and summary
        uses: actions/upload-artifact@v4
        with:
          name: jestbox-source-sbom
          path: |
            jestbox-sbom.cdx.json
            jestbox-sbom.spdx.json
            jestbox-sbom-summary.md
          if-no-files-found: error
          retention-days: 90
