name: Dependency Review

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Review dependency changes
        id: dependency-review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: critical
      - name: Create review run summary
        if: always()
        shell: bash
        run: |
          {
            printf "# Dependency Review\n\n"
            printf -- "- Commit: %s\n" "$GITHUB_SHA"
            printf -- "- Pull request: #%s\n" "$PULL_REQUEST_NUMBER"
            printf -- "- Workflow run: %s\n" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            printf -- "- Review step outcome: %s\n" "$DEPENDENCY_REVIEW_OUTCOME"
            printf "\n%s\n" "The Dependency Review action gates critical-severity dependency additions. Consult the pull-request check and action logs for package-level details."
          } > dependency-review-summary.md
          cat dependency-review-summary.md >> "$GITHUB_STEP_SUMMARY"
        env:
          DEPENDENCY_REVIEW_OUTCOME: ${{ steps.dependency-review.outcome }}
          PULL_REQUEST_NUMBER: ${{ github.event.pull_request.number }}
      - name: Archive Dependency Review summary
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jestbox-dependency-review-summary
          path: dependency-review-summary.md
          if-no-files-found: error
          retention-days: 30
