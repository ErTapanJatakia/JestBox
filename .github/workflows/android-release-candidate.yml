name: JestBox Android release candidate

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Branch, tag, or commit to build
        required: true
        default: main
        type: string
      run_batch1_mobsf:
        description: Run Batch 1 MobSF static assessment against the rebuilt, hash-pinned production APK
        required: true
        default: false
        type: boolean
      expected_apk_sha256:
        description: Approved production APK SHA-256 digest (64 hexadecimal characters)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: jestbox-android-release-candidate
  cancel-in-progress: false

jobs:
  build-release-candidate:
    name: Build and validate Android release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out selected source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_ref }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Install locked JavaScript dependencies
        run: npm ci --no-audit --no-fund

      - name: Run source regression tests
        run: |
          node --check script.js
          node --check jokes.js
          node --check share-bridge.entry.js
          node --check scripts/prepare-web.mjs
          node --check scripts/prepare-android-branding.mjs
          node --check scripts/prepare-android-security.mjs
          node --test

      - name: Verify canonical Android application ID
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const config = JSON.parse(readFileSync("capacitor.config.json", "utf8"));
            if (config.appId !== "com.jestbox.app") {
              throw new Error("Expected com.jestbox.app, received " + config.appId);
            }
          '

      - name: Prepare canonical offline web assets
        run: npm run prepare:web

      - name: Generate Capacitor Android project
        run: npx cap add android

      - name: Apply JestBox Android branding
        run: node scripts/prepare-android-branding.mjs

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Assemble release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          ./gradlew --no-daemon --max-workers=2 assembleRelease
          cd ..
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$APK"
          echo "UNSIGNED_APK=$APK" >> "$GITHUB_ENV"

      - name: Validate package identity, release flags, assets and alignment
        id: validate
        shell: bash
        run: |
          set -euo pipefail
          APK="$UNSIGNED_APK"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"

          APPLICATION_ID="$("$APKANALYZER" manifest application-id "$APK")"
          VERSION_CODE="$("$APKANALYZER" manifest version-code "$APK")"
          VERSION_NAME="$("$APKANALYZER" manifest version-name "$APK")"
          DEBUGGABLE="$("$APKANALYZER" manifest debuggable "$APK")"

          test "$APPLICATION_ID" = "com.jestbox.app"
          test "$VERSION_CODE" -ge 1
          test "$DEBUGGABLE" = "false"
          "$ZIPALIGN" -c -v 4 "$APK"
          unzip -l "$APK" | grep -q 'assets/public/index.html'

          {
            echo "### Android release candidate"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Application ID: ${APPLICATION_ID}"
            echo "- Version: ${VERSION_NAME} (${VERSION_CODE})"
            echo "- Release debuggable flag: ${DEBUGGABLE}"
            echo "- Bundled offline entry point: present"
            echo "- APK alignment: passed"
            echo "- Signing: evaluated separately; unsigned output is not distributable"
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "application_id=$APPLICATION_ID"
            echo "version_code=$VERSION_CODE"
            echo "version_name=$VERSION_NAME"
          } >> "$GITHUB_OUTPUT"
          sha256sum "$APK" | tee "$APK.sha256"

      - name: Check whether encrypted production signing credentials are configured
        id: signing_check
        shell: bash
        env:
          ANDROID_KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENCRYPTED_BASE64 }}
          ANDROID_KEYSTORE_BACKUP_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_BACKUP_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -n "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" && -n "$ANDROID_KEYSTORE_BACKUP_PASSWORD" && -n "$ANDROID_KEYSTORE_PASSWORD" && -n "$ANDROID_KEY_PASSWORD" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "Encrypted production signing credentials are configured."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            {
              echo "### Signing status"
              echo "::warning::Production signing is not configured. This run will produce an unsigned release candidate only."
              echo "No signing credentials were exposed or generated by this workflow."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Decrypt, sign and verify production APK
        if: steps.signing_check.outputs.configured == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_ENCRYPTED_BASE64: ${{ secrets.ANDROID_KEYSTORE_ENCRYPTED_BASE64 }}
          ANDROID_KEYSTORE_BACKUP_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_BACKUP_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          APK="$UNSIGNED_APK"
          ENCRYPTED="$RUNNER_TEMP/jestbox-release.jks.gpg"
          KEYSTORE="$RUNNER_TEMP/jestbox-release.jks"
          ALIGNED="$RUNNER_TEMP/jestbox-release-aligned.apk"
          SIGNED="android/app/build/outputs/apk/release/jestbox-release-signed.apk"

          printf '%s' "$ANDROID_KEYSTORE_ENCRYPTED_BASE64" | base64 --decode > "$ENCRYPTED"
          chmod 600 "$ENCRYPTED"
          test -s "$ENCRYPTED"
          printf '%s' "$ANDROID_KEYSTORE_BACKUP_PASSWORD" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --output "$KEYSTORE" --decrypt "$ENCRYPTED"
          chmod 600 "$KEYSTORE"
          test -s "$KEYSTORE"
          keytool -list -keystore "$KEYSTORE" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias jestbox-release >/dev/null

          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 "$APK" "$ALIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias jestbox-release \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --key-pass env:ANDROID_KEY_PASSWORD \
            --out "$SIGNED" "$ALIGNED"

          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$SIGNED"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -v 4 "$SIGNED"
          sha256sum "$SIGNED" | tee "$SIGNED.sha256"
          echo "Production-signed APK successfully verified." >> "$GITHUB_STEP_SUMMARY"
          rm -f "$ENCRYPTED" "$KEYSTORE" "$ALIGNED"


      - name: Verify exact approved production APK digest for Batch 1
        if: inputs.run_batch1_mobsf
        shell: bash
        env:
          APPROVED_APK_DIGEST: ${{ inputs.expected_apk_sha256 }}
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/jestbox-release-signed.apk"
          test -s "$APK"
          [[ "$APPROVED_APK_DIGEST" =~ ^[a-fA-F0-9]{64}$ ]] || {
            echo "::error::Provide the approved production APK SHA-256 digest as a 64-character hexadecimal workflow input."
            exit 1
          }
          test -s "$APK"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          if [[ "$ACTUAL_SHA256" != "$APPROVED_APK_DIGEST" ]]; then
            echo "::error::Rebuilt APK does not match the approved RuStore APK. No MobSF scan was performed."
            exit 1
          fi
          echo "Exact approved production APK SHA-256 verified: $ACTUAL_SHA256" >> "$GITHUB_STEP_SUMMARY"

      - name: Start pinned MobSF scanner for Batch 1
        if: inputs.run_batch1_mobsf
        shell: bash
        run: |
          set -euo pipefail
          MOBSF_API_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$MOBSF_API_KEY"
          echo "MOBSF_API_KEY=$MOBSF_API_KEY" >> "$GITHUB_ENV"
          docker run -d --name jestbox-mobsf-static --network host \
            -e MOBSF_API_KEY="$MOBSF_API_KEY" \
            -e MOBSF_DOMAIN_MALWARE_SCAN=0 \
            -e MOBSF_VT_ENABLED=0 \
            opensecurity/mobile-security-framework-mobsf@sha256:815bb96de3c78a22e0a0996c667c164a227239c9d8a4aba80f188d247b928954
          for _ in {1..90}; do
            if curl --silent --fail --connect-timeout 5 --max-time 15 http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs jestbox-mobsf-static
          exit 1

      - name: Run MobSF static analysis on the exact approved APK
        if: inputs.run_batch1_mobsf
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/jestbox-release-signed.apk"
          : "${MOBSF_API_KEY:?Ephemeral MobSF API key was not initialized}"
          ACTUAL_SHA256="$(sha256sum "$APK" | awk '{print $1}')"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 120 \
            -H "Authorization: $MOBSF_API_KEY" \
            -F "file=@$APK" \
            http://127.0.0.1:8000/api/v1/upload > mobsf-upload.json
          HASH="$(jq -er '.hash' mobsf-upload.json)"
          FILE_NAME="$(jq -er '.file_name' mobsf-upload.json)"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 180 -X POST \
            -H "Authorization: $MOBSF_API_KEY" \
            --data-urlencode "hash=$HASH" \
            --data-urlencode "file_name=$FILE_NAME" \
            --data-urlencode "scan_type=apk" \
            http://127.0.0.1:8000/api/v1/scan > mobsf-scan-response.json
          report_ready=false
          for _ in {1..60}; do
            if curl --silent --show-error --fail --connect-timeout 10 --max-time 180 -X POST \
              -H "Authorization: $MOBSF_API_KEY" \
              --data-urlencode "hash=$HASH" \
              http://127.0.0.1:8000/api/v1/report_json -o mobsf-report.json; then
              if jq -e 'type == "object" and (has("error") | not) and (.appsec | type == "object" and has("security_score") and has("high") and has("warning") and has("info"))' mobsf-report.json >/dev/null; then
                report_ready=true
                break
              fi
            fi
            sleep 5
          done
          [[ "$report_ready" == "true" ]] || {
            docker logs jestbox-mobsf-static
            echo "::error::MobSF did not produce a complete static JSON report."
            exit 1
          }
          {
            echo "# JestBox Batch 1 — production APK static assessment"
            echo
            echo "- Source release workflow: this run"
            echo "- Source commit: $(git rev-parse HEAD)"
            echo "- APK SHA-256: $ACTUAL_SHA256"
            echo "- Package: $(jq -r '.package_name // "not reported"' mobsf-report.json)"
            echo "- MobSF security score (appsec.security_score): $(jq -r '.appsec.security_score // "not reported"' mobsf-report.json)"
            echo "- High findings (appsec.high): $(jq -r '.appsec.high | length' mobsf-report.json)"
            echo
            echo "The JSON report is the authoritative machine-readable output. Findings require manual validation. This is static analysis, not dynamic testing or a penetration test."
          } > mobsf-production-summary.md
          cat mobsf-production-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Batch 1 MobSF evidence
        if: always() && inputs.run_batch1_mobsf && hashFiles('mobsf-report.json') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jestbox-batch1-production-static-evidence
          path: |
            mobsf-upload.json
            mobsf-scan-response.json
            mobsf-report.json
            mobsf-production-summary.md
          if-no-files-found: error
          retention-days: 30

      - name: Stop Batch 1 MobSF container
        if: always() && inputs.run_batch1_mobsf
        shell: bash
        run: docker rm -f jestbox-mobsf-static || true

      - name: Upload unsigned release candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jestbox-android-unsigned-release-candidate
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload production-signed APK
        if: steps.signing_check.outputs.configured == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jestbox-android-production-signed
          path: |
            android/app/build/outputs/apk/release/jestbox-release-signed.apk
            android/app/build/outputs/apk/release/jestbox-release-signed.apk.sha256
          if-no-files-found: error
          retention-days: 30
