name: Trivy repository security scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify committed npm dependency lockfile
        run: test -s package-lock.json
      - name: Run pinned Trivy container scan
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/work" \
            -v "$HOME/.cache/trivy:/root/.cache/" \
            aquasec/trivy:0.76.2 fs \
            --scanners vuln,secret,misconfig,license \
            --format sarif \
            --output /work/trivy-results.sarif \
            --severity UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL \
            --ignore-unfixed \
            /work
          test -s trivy-results.sarif
      - name: Upload Trivy findings to code scanning
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: trivy-results.sarif
          category: trivy-filesystem
      - name: Generate Trivy human-readable summary
        if: always() && hashFiles('trivy-results.sarif') != ''
        run: bash .github/scripts/render-sarif-summary.sh Trivy trivy-results.sarif
      - name: Archive Trivy machine-readable and human-readable reports
        if: always() && hashFiles('trivy-results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jestbox-trivy-report
          path: |
            trivy-results.sarif
            Trivy-security-summary.md
          if-no-files-found: error
          retention-days: 30
