name: Microsoft DevSkim source security lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "49 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Install pinned DevSkim CLI
        run: dotnet tool install --tool-path "$RUNNER_TEMP/devskim" Microsoft.CST.DevSkim.CLI --version 1.0.100
      - name: Analyse source with DevSkim
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/devskim/devskim" analyze -I . -O devskim-results.sarif -f sarif --skip-excerpts -g "**/.git/**,**/node_modules/**"
          test -s devskim-results.sarif
      - name: Normalize DevSkim SARIF rendered snippets
        if: always() && hashFiles('devskim-results.sarif') != ''
        shell: bash
        run: |
          set -euo pipefail
          jq '(.runs[].results[]?.locations[]?.physicalLocation.region.snippet.rendered) |= (if type == "object" and has("markdown") and (has("text") | not) then . + {"text": .markdown} else . end)' devskim-results.sarif > devskim-results.normalized.sarif
          mv devskim-results.normalized.sarif devskim-results.sarif
      - name: Upload DevSkim findings to code scanning
        if: always() && hashFiles('devskim-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: devskim-results.sarif
          category: devskim
      - name: Generate DevSkim human-readable summary
        if: always() && hashFiles('devskim-results.sarif') != ''
        run: bash .github/scripts/render-sarif-summary.sh DevSkim devskim-results.sarif
      - name: Archive DevSkim machine-readable and human-readable reports
        if: always() && hashFiles('devskim-results.sarif') != ''
        uses: actions/upload-artifact@v4
        with:
          name: jestbox-devskim-report
          path: |
            devskim-results.sarif
            DevSkim-security-summary.md
          if-no-files-found: error
          retention-days: 30
