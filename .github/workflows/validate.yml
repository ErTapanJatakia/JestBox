name: JestBox validation

on:
  push:
  pull_request:
    branches:
      - main
      - feat/capacitor-android-shell
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check jokes.js
          node --check share-bridge.entry.js
      - name: Run offline smoke tests
        run: node --test
