name: Bootstrap reviewed npm lockfile

on:
  push:
    branches:
      - security/commit-npm-lockfile
    paths:
      - ".github/workflows/npm-lockfile-bootstrap.yml"

permissions:
  contents: read

jobs:
  generate:
    if: github.actor == 'ErTapanJatakia'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the dependency-management branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Resolve exact npm dependency graph without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile to this PR branch only
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "The reviewed lockfile is already current."
            exit 0
          fi
          git commit -m "build: add reproducible npm dependency lockfile"
          gh auth setup-git
          git push origin "HEAD:${GITHUB_REF_NAME}"
