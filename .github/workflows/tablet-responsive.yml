name: JestBox tablet responsive screenshots

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tablet-browser-validation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - name: Install locked application dependencies
        run: npm ci --no-audit --no-fund
      - name: Install lockfile-pinned tablet browser tooling
        run: npm ci --prefix .github/tooling/tablet --no-audit --no-fund
      - name: Install Chromium for tablet browser tooling
        run: ./.github/tooling/tablet/node_modules/.bin/playwright install --with-deps chromium
      - name: Prepare the actual JestBox web application
        run: npm run prepare:web
      - name: Validate tablet layouts and capture screenshots
        run: node tests/tablet-responsive.mjs
      - name: Upload tablet viewport screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jestbox-tablet-responsive-screenshots
          path: tablet-screenshots/*.png
          if-no-files-found: warn
          retention-days: 14
