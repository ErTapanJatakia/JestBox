name: MobSF Android dynamic assessment

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobsf-android-dynamic.yml"
  push:
    branches: [main]
    paths:
      - ".github/workflows/mobsf-android-dynamic.yml"
      - "package.json"
      - "package-lock.json"
      - "src/**"
      - "public/**"
      - "capacitor.config.*"
      - "scripts/**"
  schedule:
    - cron: "0 4 * * 0"

permissions:
  contents: read

concurrency:
  group: jestbox-mobsf-dynamic
  cancel-in-progress: false

jobs:
  dynamic-analysis:
    name: Isolated Android API 30 dynamic assessment
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out trusted source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "emulator" "platforms;android-36" "build-tools;36.0.0" "system-images;android-30;google_apis;x86_64"

      - name: Build disposable JestBox debug APK
        shell: bash
        run: |
          set -euo pipefail
          npm ci --no-audit --no-fund
          npm run prepare:web
          npx cap add android
          node scripts/prepare-android-branding.mjs
          npx cap sync android
          cd android
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --max-workers=2 assembleDebug 2>&1 | tee "$RUNNER_TEMP/gradle-build.log"; then
              break
            else
              status=$?
            fi
            if grep -q "Received status code 429" "$RUNNER_TEMP/gradle-build.log" && [[ "$attempt" -lt 3 ]]; then
              echo "Maven Central rate-limited dependency resolution (HTTP 429); retrying after backoff."
              sleep "$((attempt * 20))"
            else
              exit "$status"
            fi
          done
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Start Android API 30 emulator and run MobSF dynamic analysis (auto mode)
        shell: bash
        env:
          ANDROID_AVD_HOME: ${{ runner.temp }}/.android/avd
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/platform-tools:$ANDROID_HOME/emulator:$PATH"
          command -v adb
          command -v emulator
          adb version
          mkdir -p "$ANDROID_AVD_HOME"
          echo "no" | "$ANDROID_HOME/cmdline-tools/latest/bin/avdmanager" create avd --force --name jestbox_api30 --package "system-images;android-30;google_apis;x86_64" --device pixel_2

          diagnostics() {
            if [[ -n "${API_KEY:-}" ]]; then
              docker logs jestbox-mobsf 2>&1 | sed "s/${API_KEY}/[REDACTED]/g" > "$GITHUB_WORKSPACE/mobsf-container.log" || true
            else
              docker logs jestbox-mobsf > "$GITHUB_WORKSPACE/mobsf-container.log" 2>&1 || true
            fi
            docker rm -f jestbox-mobsf >/dev/null 2>&1 || true
            timeout 15s adb devices -l > "$GITHUB_WORKSPACE/adb-devices.txt" 2>&1 || true
            { id; ls -l /dev/kvm; } > "$GITHUB_WORKSPACE/kvm-permissions.txt" 2>&1 || true
            cp "$RUNNER_TEMP/device-identity.txt" "$GITHUB_WORKSPACE/device-identity.txt" 2>/dev/null || true
            cat "$RUNNER_TEMP/adb-server.log" > "$GITHUB_WORKSPACE/adb-server.log" 2>/dev/null || true
            cat "$RUNNER_TEMP/emulator.log" > "$GITHUB_WORKSPACE/emulator.log" 2>/dev/null || true
            if [[ -f "$RUNNER_TEMP/emulator.pid" ]]; then
              ps -p "$(cat "$RUNNER_TEMP/emulator.pid")" -o pid=,stat=,etime=,cmd= > "$GITHUB_WORKSPACE/emulator-process.txt" 2>&1 || true
            fi
          }
          trap diagnostics EXIT

          if [[ ! -e /dev/kvm ]]; then
            echo "::error::KVM device /dev/kvm is unavailable on this runner."
            exit 1
          fi
          sudo chown "$USER":kvm /dev/kvm
          sudo chmod 660 /dev/kvm
          if [[ ! -r /dev/kvm || ! -w /dev/kvm ]]; then
            echo "::error::The runner user cannot read/write /dev/kvm after permission setup."
            ls -l /dev/kvm
            exit 1
          fi
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -avd jestbox_api30 -port 5554 -no-window -no-audio -no-boot-anim -no-snapshot -gpu swiftshader_indirect -no-metrics -wipe-data -accel on > "$RUNNER_TEMP/emulator.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/emulator.pid"

          # Bound transport discovery separately from the Android boot deadline.
          timeout 120s adb -s emulator-5554 wait-for-device
          booted=false
          for _ in {1..90}; do
            if [[ "$(timeout 15s adb -s emulator-5554 shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" == "1" ]]; then
              booted=true
              break
            fi
            sleep 5
          done
          if [[ "$booted" != "true" ]]; then
            echo "::error::Android emulator did not finish booting within 7.5 minutes."
            cat "$RUNNER_TEMP/emulator.log"
            exit 1
          fi

          timeout 30s adb -s emulator-5554 shell settings put global window_animation_scale 0
          timeout 30s adb -s emulator-5554 shell settings put global transition_animation_scale 0
          timeout 30s adb -s emulator-5554 shell settings put global animator_duration_scale 0
          DEVICE_ID="$(timeout 30s adb -s emulator-5554 shell id)"
          printf '%s\n' "$DEVICE_ID" | tee "$RUNNER_TEMP/device-identity.txt"
          timeout 15s adb -s emulator-5554 shell getprop ro.build.type

          APK="$GITHUB_WORKSPACE/android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"

          # Keep the runner's existing ADB server; host networking lets MobSF
          # reach its loopback endpoint without racing a second daemon startup.
          timeout 15s adb -s emulator-5554 devices -l
          timeout 15s adb connect 127.0.0.1:5555
          timeout 15s adb devices -l | grep -qE '^127\.0\.0\.1:5555[[:space:]]+device([[:space:]]|$)'
          timeout 15s adb devices -l
          if ! ss -ltn | grep -qE '127\.0\.0\.1:5037|0\.0\.0\.0:5037'; then
            echo "::error::ADB server is not listening on the host network namespace at port 5037."
            exit 1
          fi

          API_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$API_KEY"
          docker run -d --name jestbox-mobsf --network host \
            -e MOBSF_API_KEY="$API_KEY" \
            -e MOBSF_PLATFORM=linux \
            -e MOBSF_ANALYZER_IDENTIFIER=127.0.0.1:5555 \
            -e ADB_SERVER_SOCKET=tcp:127.0.0.1:5037 \
            -e MOBSF_DOMAIN_MALWARE_SCAN=0 \
            -e MOBSF_VT_ENABLED=0 \
            opensecurity/mobile-security-framework-mobsf@sha256:815bb96de3c78a22e0a0996c667c164a227239c9d8a4aba80f188d247b928954 # MobSF v4.6.9

          ready=false
          for _ in {1..90}; do
            if curl --silent --fail --connect-timeout 5 --max-time 15 http://127.0.0.1:8000/ >/dev/null; then
              ready=true
              break
            fi
            sleep 5
          done
          if [[ "$ready" != "true" ]]; then
            echo "::error::MobSF did not become healthy within 7.5 minutes."
            exit 1
          fi

          UPLOAD="$(curl --silent --show-error --fail --connect-timeout 10 --max-time 120 \
            -H "Authorization: $API_KEY" \
            -F "file=@$APK" \
            http://127.0.0.1:8000/api/v1/upload)"
          HASH="$(printf '%s' "$UPLOAD" | jq -er '.hash')"
          printf '%s\n' "$UPLOAD" > "$GITHUB_WORKSPACE/mobsf-upload.json"

          curl --silent --show-error --fail --connect-timeout 10 --max-time 180 -X POST \
            -H "Authorization: $API_KEY" \
            --data-urlencode "hash=$HASH" \
            http://127.0.0.1:8000/api/v1/scan \
            -o "$GITHUB_WORKSPACE/mobsf-static-scan.json"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 180 -X POST \
            -H "Authorization: $API_KEY" \
            --data-urlencode "hash=$HASH" \
            http://127.0.0.1:8000/api/v1/report_json \
            -o "$GITHUB_WORKSPACE/mobsf-static-report.json"
          jq -e 'type == "object" and (has("error") | not)' "$GITHUB_WORKSPACE/mobsf-static-report.json" >/dev/null

          curl --silent --show-error --fail --connect-timeout 10 --max-time 180 -X POST \
            -H "Authorization: $API_KEY" \
            --data-urlencode "hash=$HASH" \
            --data-urlencode "device_mode=auto" \
            --data-urlencode "install=1" \
            --data-urlencode "re_install=1" \
            http://127.0.0.1:8000/api/v1/dynamic/start_analysis \
            -o "$GITHUB_WORKSPACE/mobsf-dynamic-start.json"
          jq -e '.package and .device_identifier' "$GITHUB_WORKSPACE/mobsf-dynamic-start.json" >/dev/null
          PACKAGE="$(jq -er '.package' "$GITHUB_WORKSPACE/mobsf-dynamic-start.json")"

          timeout 30s adb -s emulator-5554 shell monkey -p "$PACKAGE" 1
          sleep 60
          timeout 30s adb -s emulator-5554 logcat -d -v time > "$GITHUB_WORKSPACE/android-logcat.txt"

          if grep -E 'FATAL EXCEPTION|Process: '"$PACKAGE" "$GITHUB_WORKSPACE/android-logcat.txt"; then
            echo "::error::The app produced a fatal runtime exception during the observation window."
            exit 1
          fi

          curl --silent --show-error --fail --connect-timeout 10 --max-time 180 -X POST \
            -H "Authorization: $API_KEY" \
            --data-urlencode "hash=$HASH" \
            http://127.0.0.1:8000/api/v1/dynamic/stop_analysis \
            -o "$GITHUB_WORKSPACE/mobsf-dynamic-stop.json"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 180 -X POST \
            -H "Authorization: $API_KEY" \
            --data-urlencode "hash=$HASH" \
            http://127.0.0.1:8000/api/v1/dynamic/report_json \
            -o "$GITHUB_WORKSPACE/mobsf-dynamic-report.json"
          jq -e 'type == "object" and (has("error") | not)' "$GITHUB_WORKSPACE/mobsf-dynamic-report.json" >/dev/null

          {
            echo "# JestBox MobSF Android dynamic assessment"
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Target: disposable debug APK on Android API 30 x86_64 emulator"
            echo "- Emulator: Google APIs image without Google Play; MobSF device mode: auto (rooted or Frida Gadget as supported); ADB endpoint 127.0.0.1:5555"
            echo "- Package: $PACKAGE"
            echo "- Observation window: 60 seconds after launch"
            echo "- MobSF static report: generated"
            echo "- MobSF dynamic report: generated"
            echo "- Scope: local emulator only; no production services or user data"
            echo
            echo "This is automated MobSF auto-mode runtime analysis, not a human-led penetration test. MobSF may fall back to Frida Gadget when root is unavailable; root-dependent inspection and system-level TLS interception may therefore be limited. Findings require manual validation."
          } > "$GITHUB_WORKSPACE/mobsf-dynamic-summary.md"
          cat "$GITHUB_WORKSPACE/mobsf-dynamic-summary.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Archive MobSF static and dynamic reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jestbox-mobsf-android-dynamic-report
          path: |
            package-lock.json
            mobsf-upload.json
            mobsf-static-scan.json
            mobsf-static-report.json
            mobsf-dynamic-start.json
            mobsf-dynamic-stop.json
            mobsf-dynamic-report.json
            mobsf-dynamic-summary.md
            mobsf-container.log
            android-logcat.txt
            emulator.log
            emulator-process.txt
            adb-server.log
            adb-devices.txt
            kvm-permissions.txt
            device-identity.txt
          if-no-files-found: warn
          retention-days: 30
