name: MobSF Android APK static assessment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/mobsf-android.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobsf:
    name: MobSF static APK analysis
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: |
          set -euo pipefail
          set +o pipefail
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          set -o pipefail
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned Capacitor toolchain
        run: npm ci --no-audit --no-fund
      - name: Prepare local web assets and Android project
        run: |
          npm run prepare:web
          npx cap add android
          npx cap sync android
          node scripts/prepare-android-branding.mjs
      - name: Assemble unsigned release APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          for attempt in 1 2 3; do
            if ./gradlew --no-daemon --max-workers=2 assembleRelease 2>&1 | tee "$RUNNER_TEMP/gradle-release.log"; then
              break
            else
              status=$?
            fi
            if grep -q "Received status code 429" "$RUNNER_TEMP/gradle-release.log" && [[ "$attempt" -lt 3 ]]; then
              echo "Maven Central rate-limited dependency resolution (HTTP 429); retrying after backoff."
              sleep "$((attempt * 20))"
            else
              exit "$status"
            fi
          done
      - name: Verify unsigned release APK is not debuggable
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          APKANALYZER="$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer"
          test -s "$APK"
          test -x "$APKANALYZER"
          DEBUGGABLE="$("$APKANALYZER" manifest debuggable "$APK")"
          if [[ "$DEBUGGABLE" != "false" ]]; then
            echo "::error::Unsigned release APK must not be debuggable (reported: $DEBUGGABLE)."
            exit 1
          fi
          sha256sum "$APK" | tee "$APK.sha256"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
          echo "Release APK manifest debuggable flag: false" >> "$GITHUB_STEP_SUMMARY"
      - name: Start isolated MobSF scanner
        id: mobsf
        shell: bash
        run: |
          set -euo pipefail
          API_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$API_KEY"
          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"
          docker run -d --name jestbox-mobsf -p 8000:8000 \
            -e MOBSF_API_KEY="$API_KEY" \
            -e MOBSF_DOMAIN_MALWARE_SCAN=0 \
            -e MOBSF_VT_ENABLED=0 \
            opensecurity/mobile-security-framework-mobsf@sha256:82a5a52bc0a9ee093381dbcd86224edb248ddcac9bcadf48216b878cb0cb1fc2
          for _ in {1..60}; do
            if curl --silent --fail --connect-timeout 5 --max-time 15 http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs jestbox-mobsf
          exit 1
      - name: Upload and statically analyse APK
        id: scan
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          MOBSF_API_KEY: ${{ steps.mobsf.outputs.api_key }}
        run: |
          set -euo pipefail
          UPLOAD="$(curl --silent --show-error --fail --connect-timeout 10 --max-time 120 \
            -H "Authorization: $MOBSF_API_KEY" \
            -F "file=@$APK_PATH" \
            http://127.0.0.1:8000/api/v1/upload)"
          HASH="$(printf '%s' "$UPLOAD" | jq -er '.hash')"
          FILE_NAME="$(printf '%s' "$UPLOAD" | jq -er '.file_name')"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          curl --silent --show-error --fail --connect-timeout 10 --max-time 180 -X POST \
            -H "Authorization: $MOBSF_API_KEY" \
            --data-urlencode "hash=$HASH" \
            --data-urlencode "file_name=$FILE_NAME" \
            --data-urlencode "scan_type=apk" \
            http://127.0.0.1:8000/api/v1/scan > mobsf-scan-response.json
          for _ in {1..60}; do
            if curl --silent --show-error --fail --connect-timeout 10 --max-time 180 -X POST \
              -H "Authorization: $MOBSF_API_KEY" \
              --data-urlencode "hash=$HASH" \
              http://127.0.0.1:8000/api/v1/report_json \
              -o mobsf-report.json; then
              if jq -e 'type == "object" and (has("error") | not)' mobsf-report.json >/dev/null; then
                exit 0
              fi
            fi
            sleep 5
          done
          docker logs jestbox-mobsf
          exit 1
      - name: Generate MobSF human-readable summary
        if: always() && hashFiles('mobsf-report.json') != ''
        shell: bash
        run: |
          {
            echo "# MobSF Android static assessment"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- App: $(jq -r '.app_name // .file_name // "Not supplied"' mobsf-report.json)"
            echo "- Package: $(jq -r '.package_name // "Not supplied"' mobsf-report.json)"
            echo "- APK variant: unsigned release build (production signing intentionally not configured)"
            echo "- Security score: $(jq -r '.security_score // "Not supplied"' mobsf-report.json)"
            echo
            echo "The full MobSF JSON is the machine-readable source. Validate findings manually; this is static analysis, not dynamic testing or a penetration test."
          } > mobsf-summary.md
          cat mobsf-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload MobSF JSON and Markdown assessment reports
        if: always() && hashFiles('mobsf-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jestbox-mobsf-static-report
          path: |
            android/app/build/outputs/apk/release/app-release-unsigned.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk.sha256
            mobsf-report.json
            mobsf-scan-response.json
            mobsf-summary.md
          if-no-files-found: error
          retention-days: 30
      - name: Stop MobSF container
        if: always()
        run: docker rm -f jestbox-mobsf || true
