name: MobSF Android APK static assessment

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mobsf:
    name: MobSF static APK analysis
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: read
    steps:
      - name: Check out trusted main source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned Capacitor toolchain
        run: npm install --no-audit --no-fund
      - name: Prepare local web assets and Android project
        run: |
          npm run prepare:web
          npx cap add android
          node scripts/prepare-android-branding.mjs
          npx cap sync android
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify APK artifact exists
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"
      - name: Start isolated MobSF scanner
        id: mobsf
        shell: bash
        run: |
          set -euo pipefail
          API_KEY="$(openssl rand -hex 32)"
          echo "::add-mask::$API_KEY"
          echo "api_key=$API_KEY" >> "$GITHUB_OUTPUT"
          docker run -d --name jestbox-mobsf -p 8000:8000 \
            -e MOBSF_API_KEY="$API_KEY" \
            -e MOBSF_DOMAIN_MALWARE_SCAN=0 \
            -e MOBSF_VT_ENABLED=0 \
            opensecurity/mobile-security-framework-mobsf:latest
          for _ in {1..60}; do
            if curl --silent --fail http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          docker logs jestbox-mobsf
          exit 1
      - name: Upload and statically analyse APK
        id: scan
        shell: bash
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          MOBSF_API_KEY: ${{ steps.mobsf.outputs.api_key }}
        run: |
          set -euo pipefail
          UPLOAD="$(curl --silent --show-error --fail \
            -H "Authorization: $MOBSF_API_KEY" \
            -F "file=@$APK_PATH" \
            http://127.0.0.1:8000/api/v1/upload)"
          HASH="$(printf '%s' "$UPLOAD" | jq -er '.hash')"
          FILE_NAME="$(printf '%s' "$UPLOAD" | jq -er '.file_name')"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"
          curl --silent --show-error --fail -X POST \
            -H "Authorization: $MOBSF_API_KEY" \
            --data-urlencode "hash=$HASH" \
            --data-urlencode "file_name=$FILE_NAME" \
            --data-urlencode "scan_type=apk" \
            http://127.0.0.1:8000/api/v1/scan > mobsf-scan-response.json
          for _ in {1..60}; do
            if curl --silent --show-error --fail -X POST \
              -H "Authorization: $MOBSF_API_KEY" \
              --data-urlencode "hash=$HASH" \
              http://127.0.0.1:8000/api/v1/report_json \
              -o mobsf-report.json; then
              if jq -e 'type == "object" and (has("error") | not)' mobsf-report.json >/dev/null; then
                exit 0
              fi
            fi
            sleep 5
          done
          docker logs jestbox-mobsf
          exit 1
      - name: Generate MobSF human-readable summary
        if: always() && hashFiles('mobsf-report.json') != ''
        shell: bash
        run: |
          {
            echo "# MobSF Android static assessment"
            echo
            echo "- Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "- Commit: $GITHUB_SHA"
            echo "- App: $(jq -r '.app_name // .file_name // "Not supplied"' mobsf-report.json)"
            echo "- Package: $(jq -r '.package_name // "Not supplied"' mobsf-report.json)"
            echo "- Security score: $(jq -r '.security_score // "Not supplied"' mobsf-report.json)"
            echo
            echo "The full MobSF JSON is the machine-readable source. Validate findings manually; this is static analysis, not dynamic testing or a penetration test."
          } > mobsf-summary.md
          cat mobsf-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload MobSF JSON and Markdown assessment reports
        if: always() && hashFiles('mobsf-report.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jestbox-mobsf-static-report
          path: |
            mobsf-report.json
            mobsf-scan-response.json
            mobsf-summary.md
          if-no-files-found: error
          retention-days: 30
      - name: Stop MobSF container
        if: always()
        run: docker rm -f jestbox-mobsf || true
