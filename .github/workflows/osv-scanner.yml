name: OSV-Scanner dependency assessment

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Verify committed npm dependency lockfile
        run: test -s package-lock.json
      - name: Run pinned OSV-Scanner container
        shell: bash
        run: |
          set +e
          docker run --rm -v "$GITHUB_WORKSPACE:/src" ghcr.io/google/osv-scanner:v2.7.1 scan source --recursive --format sarif --output /src/osv-results.sarif /src
          status=$?
          set -e
          if [ ! -s osv-results.sarif ]; then
            echo "::error::OSV-Scanner did not produce a SARIF report (exit $status)."
            exit 1
          fi
          if [ "$status" -ne 0 ]; then
            echo "::warning::OSV-Scanner reported findings; review the SARIF report."
          fi
      - name: Upload OSV findings to code scanning
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: osv-results.sarif
          category: osv-scanner
      - name: Generate OSV human-readable summary
        if: always() && hashFiles('osv-results.sarif') != ''
        run: bash .github/scripts/render-sarif-summary.sh OSV-Scanner osv-results.sarif
      - name: Archive OSV machine-readable and human-readable reports
        if: always() && hashFiles('osv-results.sarif') != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jestbox-osv-scanner-report
          path: |
            osv-results.sarif
            OSV-Scanner-security-summary.md
            package-lock.json
          if-no-files-found: error
          retention-days: 30
