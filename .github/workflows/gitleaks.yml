name: Gitleaks secret detection

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "13 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Scan repository history for secrets
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out full Git history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/repo" \
            zricethezav/gitleaks:v8.24.3 \
            detect --source=/repo --report-format=sarif \
            --report-path=/repo/gitleaks-results.sarif \
            --redact --exit-code=0
          test -s gitleaks-results.sarif
      - name: Upload secret findings to code scanning
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: gitleaks-results.sarif
          category: gitleaks
      - name: Generate Gitleaks summary
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        shell: bash
        run: |
          bash .github/scripts/render-sarif-summary.sh Gitleaks gitleaks-results.sarif
      - name: Archive redacted Gitleaks report
        if: always() && hashFiles('gitleaks-results.sarif') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jestbox-gitleaks-report
          path: |
            gitleaks-results.sarif
            Gitleaks-security-summary.md
          if-no-files-found: error
          retention-days: 30
