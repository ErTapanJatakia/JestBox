name: OpenSSF Scorecard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "30 1 * * 6"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    name: Supply-chain security posture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run pinned OpenSSF Scorecard CLI container
        shell: bash
        env:
          GITHUB_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          docker run --rm \
            -e GITHUB_AUTH_TOKEN="$GITHUB_AUTH_TOKEN" \
            ghcr.io/ossf/scorecard:v5.5.0 \
            --repo=github.com/ErTapanJatakia/JestBox \
            --format=json \
            --show-details > scorecard.json
          jq -e '.score != null and (.checks | type == "array")' scorecard.json >/dev/null
      - name: Publish Scorecard summary
        shell: bash
        run: |
          {
            echo "## OpenSSF Scorecard"
            echo
            echo "Overall score: $(jq -r '.score' scorecard.json)/10"
            echo
            echo "| Check | Score | Reason |"
            echo "|---|---:|---|"
            jq -r '.checks[] | "| " + .name + " | " + (.score | tostring) + "/10 | " + ((.reason // "No reason supplied") | gsub("\\|"; "\\\\|")) + " |"' scorecard.json
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload Scorecard JSON report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jestbox-openssf-scorecard-report
          path: scorecard.json
          if-no-files-found: error
          retention-days: 30
