name: JestBox Android debug build

on:
  push:
    paths:
      - "index.html"
      - "script.js"
      - "styles.css"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches:
      - main
    paths:
      - "index.html"
      - "script.js"
      - "styles.css"
      - "assets/**"
      - "scripts/**"
      - "package.json"
      - "capacitor.config.json"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jestbox-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install pinned Capacitor toolchain
        run: npm install --no-audit --no-fund
      - name: Prepare local web assets
        run: npm run prepare:web
      - name: Generate Android platform project
        run: npx cap add android
      - name: Synchronize native project
        run: npx cap sync android
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jestbox-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
