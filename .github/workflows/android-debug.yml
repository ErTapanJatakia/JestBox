name: JestBox Android debug build

on:
  push:
  pull_request:
    branches:
      - main
      - feat/capacitor-android-shell
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: jestbox-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check script.js
          node --check jokes.js
          node --check share-bridge.entry.js
          node --check scripts/prepare-web.mjs
          node --check scripts/prepare-android-branding.mjs
      - name: Run dependency-free regression tests
        run: node --test
      - name: Set up Java
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1
        with:
          distribution: temurin
          java-version: "21"
      - name: Install Android SDK components
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - name: Install pinned Capacitor toolchain
        run: npm install --no-audit --no-fund
      - name: Prepare local web assets
        run: npm run prepare:web
      - name: Generate Android platform project
        run: npx cap add android
      - name: Apply original JestBox launcher artwork
        run: node scripts/prepare-android-branding.mjs
      - name: Synchronize native project
        run: npx cap sync android
      - name: Assemble debug APK
        run: cd android && ./gradlew --no-daemon assembleDebug
      - name: Verify APK signature, alignment, and checksum
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          ZIPALIGN="$ANDROID_HOME/build-tools/36.0.0/zipalign"
          test -s "$APK"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          "$ZIPALIGN" -c -v 4 "$APK"
          sha256sum "$APK" | tee "$APK.sha256"
      - name: Upload debug APK and checksum
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: jestbox-android-debug
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
          retention-days: 14
